name: Setup Nix
description: Install Nix and load the dev shell
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        github_access_token: ${{ github.token }}

    - name: Load Nix development environment
      shell: bash
      run: nix develop --command true
