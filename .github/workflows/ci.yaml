name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: Gate (fmt, clippy, tests, TS, TLA+, Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The hatches step reads the lines added since the merge base with main.
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Restore cargo and pnpm caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
            ~/.local/share/pnpm/store
          key: gate-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'ui/pnpm-lock.yaml') }}
          restore-keys: gate-${{ runner.os }}-

      # The same script developers and the Claude Code hook run.
      - name: Run the gate
        run: nix develop --command tools/gate
